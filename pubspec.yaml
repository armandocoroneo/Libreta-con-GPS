name: libreta_gps
description: Libreta GPS para repartidores.

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  sqflite: ^2.3.3
  path: ^1.9.0

  geolocator: ^12.0.0

  image_picker: ^1.1.2

  permission_handler: ^11.3.1

  url_launcher: ^6.3.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
